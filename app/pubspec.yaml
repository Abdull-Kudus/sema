name: sema
description: "Sema: campus incident reporting for African Leadership University."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  google_sign_in: ^7.2.0

  # State and navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  shared_preferences: ^2.5.6

  # Media
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  cached_network_image: ^4.0.6

  # UI
  skeletonizer: ^3.0.0
  flutter_animate: ^4.5.2
  solar_icons: ^0.2.0
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.5.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  firebase_auth_mocks: ^0.16.0

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    - family: ClashGrotesk
      fonts:
        - asset: assets/fonts/ClashGrotesk-Regular.otf
          weight: 400
        - asset: assets/fonts/ClashGrotesk-Medium.otf
          weight: 500
        - asset: assets/fonts/ClashGrotesk-Semibold.otf
          weight: 600
        - asset: assets/fonts/ClashGrotesk-Bold.otf
          weight: 700

# `dart run flutter_launcher_icons` — icons are rendered from SemaMark by
# test/tool/brand_assets_test.dart (`flutter test --update-goldens test/tool`).
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/brand/icon_foreground.png

# `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  image: assets/brand/splash.png
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
    image: assets/brand/splash.png
